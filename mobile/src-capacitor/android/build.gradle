// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Expose bundletool through Gradle's resolved Android build classpath so CI can
// inspect the generated AAB without downloading a separate executable.
def bundlePath = providers.gradleProperty("bundlePath")
tasks.register("dumpBundleConfig", JavaExec) {
    classpath = buildscript.configurations.classpath
    mainClass.set("com.android.tools.build.bundletool.BundleToolMain")
    doFirst {
        if (!bundlePath.isPresent()) {
            throw new GradleException("Pass the AAB path with -PbundlePath=/absolute/path/app.aab")
        }
        args("dump", "config", "--bundle=${bundlePath.get()}")
    }
}
