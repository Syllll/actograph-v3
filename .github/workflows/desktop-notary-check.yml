name: Check desktop notarization authentication

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14
    environment: deploy
    permissions:
      contents: read
    steps:
      - name: Check Apple ID authentication
        id: apple-id
        continue-on-error: true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing secret: $name" >&2
              exit 1
            fi
          done
          # Keep submission history off the logs and out of published artifacts.
          xcrun notarytool history --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --output-format json > "$RUNNER_TEMP/apple-id-notary.json"

      - name: Check App Store Connect API authentication
        id: api-key
        continue-on-error: true
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "Missing secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          private_key="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          trap 'rm -f "$private_key"' EXIT
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | openssl base64 -d -A > "$private_key"
          xcrun notarytool history --key "$private_key" \
            --key-id "$APP_STORE_CONNECT_API_KEY_ID" --issuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --output-format json > "$RUNNER_TEMP/api-notary.json"

      - name: Report authentication results
        if: always()
        env:
          APPLE_ID_RESULT: ${{ steps.apple-id.outcome }}
          API_KEY_RESULT: ${{ steps.api-key.outcome }}
        run: |
          echo "Apple ID authentication: $APPLE_ID_RESULT"
          echo "App Store Connect API authentication: $API_KEY_RESULT"
          if [ "$APPLE_ID_RESULT" != success ] && [ "$API_KEY_RESULT" != success ]; then
            exit 1
          fi
