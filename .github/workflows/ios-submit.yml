name: Submit existing iOS build to App Review

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing iOS version in App Store Connect (for example 1.3.4)
        required: true
        type: string

jobs:
  submit-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Submit processed iOS build
        shell: bash
        env:
          IOS_RELEASE_VERSION: ${{ inputs.version }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "Missing App Store Connect secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          export APP_STORE_CONNECT_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          trap 'rm -f "$APP_STORE_CONNECT_API_KEY_PATH"' EXIT
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$APP_STORE_CONNECT_API_KEY_PATH"
          node scripts/submit-ios-release.mjs "$IOS_RELEASE_VERSION"
